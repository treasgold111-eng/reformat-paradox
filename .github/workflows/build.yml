name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID || 'ca-app-pub-5561137494743513~5362751625' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Put the web app in www
        run: |
          newest=$(for f in *.html; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
          echo "Using: $newest"
          mkdir -p www
          cp "$newest" www/index.html

      - name: Install
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Add the AdMob app ID to the manifest
        run: |
          python3 - <<'PY'
          import os, re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          tag = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="%s"/>' % os.environ['ADMOB_APP_ID']
          s = re.sub(r'(<application[^>]*>)', lambda m: m.group(1) + '\n        ' + tag, s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Use my app icon
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --break-system-packages pillow
          python3 - <<'PY'
          import os, shutil
          from PIL import Image
          res = 'android/app/src/main/res'
          shutil.rmtree(res + '/mipmap-anydpi-v26', ignore_errors=True)
          icon = Image.open('icon.png').convert('RGBA')
          for d, px in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              folder = res + '/mipmap-' + d
              os.makedirs(folder, exist_ok=True)
              small = icon.resize((px, px), Image.LANCZOS)
              small.save(folder + '/ic_launcher.png')
              small.save(folder + '/ic_launcher_round.png')
          PY

      - name: Sync
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ReformatParadox-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
