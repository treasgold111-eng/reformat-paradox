name: Release build (signed)

on:
  workflow_dispatch:
    inputs:
      test_ads:
        description: 'true = Google test ads (safe for testers), false = real ads'
        type: choice
        default: 'true'
        options:
          - 'true'
          - 'false'

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ADMOB_APP_ID: ca-app-pub-5561137494743513~5362751625
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      TEST_ADS: ${{ inputs.test_ads }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Check the signing secrets exist
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "Missing secret KEYSTORE_BASE64"; exit 1; }
          [ -n "$KEYSTORE_PASSWORD" ] || { echo "Missing secret KEYSTORE_PASSWORD"; exit 1; }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check the signing key works
        run: |
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/check.p12" || { echo "The KEYSTORE_BASE64 secret is not valid text. Paste it again."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/check.p12" -storepass "$KEYSTORE_PASSWORD" -alias upload > /dev/null || { echo "The key or password is wrong. Check both secrets."; exit 1; }
          echo "Signing key looks good."

      - name: Put the web app in www
        run: |
          newest=$(for f in index*.html; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -1 | cut -d' ' -f2-)
          echo "Using: $newest"
          mkdir -p www
          cp "$newest" www/index.html
          sed -i "s/const SHOW_AD_STATUS = true;/const SHOW_AD_STATUS = false;/" www/index.html
          grep -q "const SHOW_AD_STATUS = false;" www/index.html
          if [ "$TEST_ADS" = "false" ]; then sed -i "s/const ADMOB_TESTING = true;/const ADMOB_TESTING = false;/" www/index.html; grep -q "const ADMOB_TESTING = false;" www/index.html; fi

      - name: Install
        run: npm install --fetch-retries=5 --fetch-retry-mintimeout=5000

      - name: Create the Android project
        run: npx cap add android

      - name: Add the AdMob app ID to the manifest
        run: |
          python3 - <<'PY'
          import os, re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          tag = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="%s"/>' % os.environ['ADMOB_APP_ID']
          s = re.sub(r'(<application[^>]*>)', lambda m: m.group(1) + '\n        ' + tag, s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Use my app icon
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --break-system-packages pillow
          python3 - <<'PY'
          import os, shutil
          from PIL import Image
          res = 'android/app/src/main/res'
          shutil.rmtree(res + '/mipmap-anydpi-v26', ignore_errors=True)
          icon = Image.open('icon.png').convert('RGBA')
          for d, px in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              folder = res + '/mipmap-' + d
              os.makedirs(folder, exist_ok=True)
              small = icon.resize((px, px), Image.LANCZOS)
              small.save(folder + '/ic_launcher.png')
              small.save(folder + '/ic_launcher_round.png')
          PY

      - name: Set the version number
        run: |
          python3 - <<'PY'
          import os, re
          n = int(os.environ['RUN_NUMBER'])
          done = False
          for p in ('android/app/build.gradle', 'android/app/build.gradle.kts'):
              if not os.path.exists(p):
                  continue
              s = open(p, encoding='utf-8').read()
              s, a = re.subn(r'(versionCode\s*=?\s*)\d+', lambda m: m.group(1) + str(n), s, count=1)
              s, b = re.subn(r'(versionName\s*=?\s*)"[^"]*"', lambda m: m.group(1) + '"1.0.%d"' % n, s, count=1)
              open(p, 'w', encoding='utf-8').write(s)
              print(p, 'versionCode', n, 'changed' if a else 'NOT FOUND', '| versionName', 'changed' if b else 'NOT FOUND')
              done = done or bool(a)
          assert done, 'Could not set the version number'
          PY

      - name: Sync
        run: npx cap sync android

      - name: Build the release files (tries again if a download fails)
        working-directory: android
        run: |
          chmod +x gradlew
          for i in 1 2 3 4 5; do
            ./gradlew bundleRelease assembleRelease --no-daemon && exit 0
            echo "Attempt $i failed. Waiting 45 seconds, then trying again."
            sleep 45
          done
          exit 1

      - name: Sign the files
        run: |
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload.p12"
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          OUT="$GITHUB_WORKSPACE/signed"
          mkdir -p "$OUT"
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          cp "$AAB" "$OUT/ReformatParadox-release.aab"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/upload.p12" -storepass:env KEYSTORE_PASSWORD "$OUT/ReformatParadox-release.aab" upload
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          "$TOOLS/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/upload.p12" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias upload --out "$OUT/ReformatParadox-release.apk" "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" verify --print-certs "$OUT/ReformatParadox-release.apk" | head -3
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ReformatParadox-release
          path: signed/
